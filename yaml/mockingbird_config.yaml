http:
    servers:
        - listen: 8081
          logger: true
          logger_path: ./logs/server_8081
          name: server_8081
          version: 0.0.1
          location:
            - path: /api/data
              method: GET
              response: '{"data": [1, 2, 3, 4, 5]}'
              status_code: 200
              headers:
                User-Agent: ""
        - listen: 8101
          logger: true
          logger_path: ./logs/server_8101
          name: server_8101
          version: 0.0.1
          location:
            - path: /hi
              method: GET
              response: '{"message": "Hello, World!"}'
              status_code: 200
              headers:
                User-Agent: ""
        - listen: 8086
          logger: true
          logger_path: ./logs/server_8086
          name: server_8086
          version: 0.0.1
          location:
            - path: /api/v1/auth/token
              method: POST
              response: |
                {
                  "access_token": "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9...",
                  "expires_in": 3600,
                  "refresh_expires_in": 1800,
                  "refresh_token": "refresh_token_here",
                  "token_type": "Bearer",
                  "not_before_policy": 0,
                  "session_state": "session_state_here",
                  "scope": "openid profile email"
                }
              status_code: 200
              headers:
                Content-Length: ""
                Content-Type: ""
                Expect: ""
                User-Agent: ""
        - listen: 8080
          logger: true
          logger_path: ./logs/server_8080
          name: server_8080
          version: 0.0.1
          location:
            - path: /api/data
              method: GET
              response: '{"data": [1, 2, 3, 4, 5]}'
              status_code: 200
              headers:
                Accept: ""
                Accept-Encoding: ""
                Connection: ""
                Postman-Token: ""
                User-Agent: ""
            - path: /api/v1/auth/token
              method: POST
              response: |
                {
                  "access_token": "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9...",
                  "expires_in": 3600,
                  "refresh_expires_in": 1800,
                  "refresh_token": "refresh_token_here",
                  "token_type": "Bearer",
                  "not_before_policy": 0,
                  "session_state": "session_state_here",
                  "scope": "openid profile email"
                }
              status_code: 200
              headers:
                Accept: ""
                Accept-Encoding: ""
                Connection: ""
                Content-Length: ""
                Postman-Token: ""
                User-Agent: ""
            - path: /hi
              method: GET
              response: '{"message": "Hello, World!"}'
              status_code: 200
              headers:
                User-Agent: ""
            - path: /api/hello
              method: GET
              response: '{"message": "Hello, World!"}'
              status_code: 200
              headers:
                Accept: ""
                Accept-Encoding: ""
                Connection: ""
                Postman-Token: ""
                User-Agent: ""
            - path: /api/async
              method: POST
              response: '{"status": "processing"}'
              status_code: 202
              headers:
                Accept: ""
                Accept-Encoding: ""
                Connection: ""
                Content-Length: ""
                Postman-Token: ""
                User-Agent: ""
            - path: /api/callback
              method: POST
              response: '{"message": "Callback ok"}'
              status_code: 200
              headers:
                Accept: ""
                Accept-Encoding: ""
                Connection: ""
                Content-Length: ""
                Postman-Token: ""
                User-Agent: ""
